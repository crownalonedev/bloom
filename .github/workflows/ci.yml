name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 8: legacy test runtime; 25: 26.x compile verification; 21 last = default compiler JDK.
          java-version: |
            8
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      # build = compile (incl. paper-api 1.21.1 / 26.3 verification), Spotless, Javadoc, unit tests on Java 21 and 8,
      # SQLite tests on the 1.8-era driver, MockBukkit integration tests, example plugin jars.
      - run: ./gradlew build apiManifest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: api-manifest
          path: build/api/api-manifest.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  template:
    name: Consumer template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/verify-template.sh

  website:
    name: Website
    needs: java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: api-manifest
          path: build/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      # build = content generation, Vite, prerender, then check-site (links, anchors, accessibility).
      - run: npm run build
