# Bloom dependency catalog.
# Versions were verified against official repositories on 2026-10-12.
# See docs/architecture/DECISIONS.md (ADR-004) before changing platform API versions.

[versions]
# --- Platform APIs (compileOnly; never shaded) ---
spigot-legacy = "1.8.8-R0.1-SNAPSHOT"      # Lowest common Bukkit API Bloom compiles shared code against
paper-modern = "1.21.11-R0.1-SNAPSHOT"     # Primary modern adapter compile target (Java 21)
paper-modern-min = "1.21.1-R0.1-SNAPSHOT"  # Compile-verification: oldest supported modern API
paper-next = "26.3.build.177-stable"       # Compile-verification: newest supported API (Java 25)

# --- Runtime libraries (shaded by consumers) ---
snakeyaml = "2.7"         # Java 8 bytecode; bundled server copies differ by version, so Bloom ships its own
hikari = "4.0.3"          # Last HikariCP line with Java 8 bytecode (5.x+ requires Java 11)
asm = "9.11"
jetbrains-annotations = "26.1.0"  # compile-only: referenced by Paper/Adventure API annotations

# --- Test-only ---
junit5 = "5.14.4"         # Java 8-compatible JUnit, used for modules that must be tested on Java 8
junit6 = "6.1.3"          # Used with MockBukkit (which itself depends on JUnit 6)
mockbukkit = "4.116.3"
mockbukkit-next = "4.117.0"
sqlite-jdbc = "3.53.4.0"
mariadb-jdbc = "3.5.10"
mysql-jdbc = "26.7.0"

[libraries]
spigot-api-legacy = { module = "org.spigotmc:spigot-api", version.ref = "spigot-legacy" }
paper-api-modern = { module = "io.papermc.paper:paper-api", version.ref = "paper-modern" }
paper-api-modern-min = { module = "io.papermc.paper:paper-api", version.ref = "paper-modern-min" }
paper-api-next = { module = "io.papermc.paper:paper-api", version.ref = "paper-next" }

snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }

junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit6-bom = { module = "org.junit:junit-bom", version.ref = "junit6" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
mysql-jdbc = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-jdbc" }
